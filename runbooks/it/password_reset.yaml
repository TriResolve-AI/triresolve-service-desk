action: password_reset
description: Reset user password and unlock account
steps:
  - validate_user_identity:
      method: email_verification
      required: true
  - check_AD_lockout_status:
      system: active_directory
      timeout: 30
  - reset_password:
      generate_temp: true
      force_change: true
  - notify_user:
      message: "Your password has been reset. Please check your email for temporary credentials."
      channels:
        - email
        - sms
success_criteria:
  - user_unlocked: true
  - password_changed: true
  - notification_sent: true
