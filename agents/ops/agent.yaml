id: triresolve-ops
display_name: TriResolve Ops Agent
description: >
  Handles operational questions, incident triage, log interpretation,
  SLO/SLA considerations, and on-call guidance.

model:
  deployment_env_var: AZURE_OPENAI_DEPLOYMENT_OPS
  temperature: 0.35
  top_p: 1.0
  max_output_tokens: 3072

instructions:
  file: agent.md

capabilities:
  - incident_analysis
  - root_cause_hypothesis
  - operational_guidance
  - verification_checks
  - escalation_logic

downstream_tools: []
upstream_agents:
  - triresolve-security

response_format: json

tags:
  - agent
  - ops
  - sre
  - incident_management
  - triresolve
