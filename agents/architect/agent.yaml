id: triresolve-architect
display_name: TriResolve Architect Agent
description: >
  Designs high-level and detailed architecture for workflows, integrations,
  and multi-agent service desk processes. Produces structured plans that
  downstream agents and humans can follow.

model:
  deployment_env_var: AZURE_OPENAI_DEPLOYMENT_ARCHITECT
  temperature: 0.4
  top_p: 1.0
  max_output_tokens: 4096

instructions:
  file: agent.md

capabilities:
  - system_design
  - workflow_mapping
  - data_flow_analysis
  - tool_selection
  - options_with_risks

downstream_tools: []
upstream_agents:
  - triresolve-security
  - triresolve-ops

response_format: json

tags:
  - agent
  - architect
  - design
  - planning
  - triresolve
