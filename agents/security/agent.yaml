id: triresolve-security
display_name: TriResolve Security Agent
description: >
  Evaluates requests, workflows, and plans for security, privacy,
  and compliance risks. Provides clear guidance and required controls.

model:
  deployment_env_var: AZURE_OPENAI_DEPLOYMENT_SECURITY
  temperature: 0.3
  top_p: 1.0
  max_output_tokens: 3072

instructions:
  file: agent.md

capabilities:
  - risk_assessment
  - compliance_analysis
  - policy_lookup
  - escalation_recommendation

downstream_tools: []
upstream_agents: []

response_format: json

tags:
  - agent
  - security
  - compliance
  - risk
  - triresolve
