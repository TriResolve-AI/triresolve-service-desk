id: triresolve-orchestrator
display_name: TriResolve Orchestrator (TriNexa)
description: >
  The global coordinator for the TriResolve AI Service Desk.
  Determines which agents to call (Classifier, IT, HR, Finance, Architect, Security, Ops)
  and merges their outputs into one unified Final Answer.

model:
  deployment_env_var: AZURE_OPENAI_DEPLOYMENT_ORCHESTRATOR
  temperature: 0.4
  top_p: 1.0
  max_output_tokens: 4096

instructions:
  file: agent.md

capabilities:
  - multi_agent_routing
  - domain_decision_making
  - response_aggregation
  - fallback_handling
  - risk_elevation

upstream_agents:
  - triresolve-classifier
  - triresolve-it
  - triresolve-hr
  - triresolve-finance
  - triresolve-architect
  - triresolve-security
  - triresolve-ops

response_format: json

tags:
  - agent
  - orchestrator
  - coordinator
  - triage
  - triresolve
  - trinesa
