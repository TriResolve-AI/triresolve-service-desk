name: Auto Triage New Issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Add or apply triage label via REST
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ISSUE_NUMBER=${{ github.event.issue.number }}
          OWNER=${{ github.repository_owner }}
          REPO=${{ github.event.repository.name }}
          LABEL_NAME='status: needs triage'
          LABEL_COLOR='FFA500'
          LABEL_DESC='Issue requires triage'

          # Create the label if it doesn't exist (ignore failures)
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"name\":\"${LABEL_NAME}\",\"color\":\"${LABEL_COLOR}\",\"description\":\"${LABEL_DESC}\"}" \
            "https://api.github.com/repos/${OWNER}/${REPO}/labels" || true

          # Add the label to the issue
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "[\"${LABEL_NAME}\"]" \
            "https://api.github.com/repos/${OWNER}/${REPO}/issues/${ISSUE_NUMBER}/labels"
