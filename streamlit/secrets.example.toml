# ===========================
# TriResolve / TriNexa – Streamlit Secrets (Example)
# Copy this into Streamlit Cloud's "Secrets" and
# replace placeholder values with your real ones.
# ===========================

[azure]
AZURE_SUBSCRIPTION_ID = "YOUR_SUBSCRIPTION_GUID"
AZURE_TENANT_ID       = "YOUR_TENANT_GUID"
AZURE_RESOURCE_GROUP  = "trinexa-rg"
AZURE_LOCATION        = "eastus"

# Azure OpenAI Core
AZURE_OPENAI_ENDPOINT    = "https://your-resource-name.openai.azure.com"
AZURE_OPENAI_API_KEY     = "YOUR_OPENAI_API_KEY"
AZURE_OPENAI_API_VERSION = "2024-02-15-preview"

# Azure OpenAI Agent Deployments (must match Foundry agent names)
AZURE_OPENAI_DEPLOYMENT_ORCHESTRATOR = "triresolve-orchestrator"
AZURE_OPENAI_DEPLOYMENT_CLASSIFIER   = "triresolve-classifier"
AZURE_OPENAI_DEPLOYMENT_HR           = "triresolve-hr"
AZURE_OPENAI_DEPLOYMENT_IT           = "triresolve-it"
AZURE_OPENAI_DEPLOYMENT_FINANCE      = "triresolve-finance"
AZURE_OPENAI_DEPLOYMENT_ARCHITECT    = "trinexa-architect-agent"
AZURE_OPENAI_DEPLOYMENT_SECURITY     = "trinexa-security-agent"
AZURE_OPENAI_DEPLOYMENT_OPS          = "trinexa-ops-agent"

# Azure AI Project / Foundry (if you use it directly)
AZURE_AIPROJECT_ENDPOINT    = "https://your-project-endpoint.cognitiveservices.azure.com"
AZURE_AIPROJECT_RESOURCE_ID = "/subscriptions/…/resourceGroups/…/providers/Microsoft.CognitiveServices/accounts/…"

[backend]
# Only needed if Streamlit calls your FastAPI backend
BACKEND_URL = "http://localhost:8000"

[debug]
LOG_LEVEL = "INFO"
APP_ENV   = "development"
