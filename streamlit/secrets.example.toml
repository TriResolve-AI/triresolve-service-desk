# Example Streamlit secrets for TriResolve / TriNexa
# --------------------------------------------------
# Copy this file to `streamlit/secrets.toml` locally
# and replace the placeholder values with real secrets.
# Do NOT commit `streamlit/secrets.toml`.

[azure]
AZURE_SUBSCRIPTION_ID = "YOUR_AZURE_SUBSCRIPTION_ID"
AZURE_TENANT_ID       = "YOUR_AZURE_TENANT_ID"
AZURE_RESOURCE_GROUP  = "YOUR_RESOURCE_GROUP_NAME"
AZURE_LOCATION        = "eastus"

AZURE_OPENAI_ENDPOINT    = "https://YOUR-RESOURCE-NAME.openai.azure.com"
AZURE_OPENAI_API_KEY     = "YOUR_AZURE_OPENAI_KEY_HERE"
AZURE_OPENAI_API_VERSION = "2024-02-15-preview"

AZURE_OPENAI_DEPLOYMENT_ORCHESTRATOR = "triresolve-orchestrator"
AZURE_OPENAI_DEPLOYMENT_CLASSIFIER   = "triresolve-classifier"
AZURE_OPENAI_DEPLOYMENT_HR           = "triresolve-hr"
AZURE_OPENAI_DEPLOYMENT_IT           = "triresolve-it"
AZURE_OPENAI_DEPLOYMENT_FINANCE      = "triresolve-finance"

AZURE_OPENAI_DEPLOYMENT_ARCHITECT    = "trinexa-architect-agent"
AZURE_OPENAI_DEPLOYMENT_SECURITY     = "trinexa-security-agent"
AZURE_OPENAI_DEPLOYMENT_OPS          = "trinexa-ops-agent"

AZURE_AIPROJECT_ENDPOINT    = "https://YOUR-PROJECT-ENDPOINT"
AZURE_AIPROJECT_RESOURCE_ID = "/subscriptions/YOUR_SUB/resourceGroups/YOUR_RG/providers/Microsoft.CognitiveServices/accounts/YOUR_ACCOUNT/projects/YOUR_PROJECT"

[backend]
BACKEND_URL = "http://localhost:8000"

[debug]
LOG_LEVEL = "INFO"
APP_ENV   = "development"
